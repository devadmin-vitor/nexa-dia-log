# Serviços auxiliares locais do Claude Commerce AI.
#
# O Supabase (PostgreSQL + Auth + Studio) é gerenciado pelo Supabase CLI (npx supabase start),
# que cria seus próprios containers. A API (FastAPI) e o dashboard (Next.js) rodam nativamente
# no Windows (scripts/start.ps1) para facilitar o desenvolvimento no VS Code.
#
# Todas as portas ficam presas a 127.0.0.1: nada é exposto à rede/internet.

name: claude-commerce-ai

services:
  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.48.8}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0       # evita falha em hosts sem IPv6; a porta no host continua em 127.0.0.1
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"          # acesso apenas local via http://localhost
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    extra_hosts:
      # Permite que os workflows chamem a API que roda no Windows (porta 8000).
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  redis_data:
  n8n_data:
